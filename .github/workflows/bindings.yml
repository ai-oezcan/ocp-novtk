name: Native OCP novtk wheels

on:
  push:
    branches: [master, main]
    tags: ["ocp-novtk-8.0.1.0.0-novtk.1"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bindings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Linux:
    uses: ./.github/workflows/build-job.yml
    with:
      name: Linux x86_64
      runner_generate: ubuntu-22.04
      runner_compile: ubuntu-22.04
      platform: Linux

  Windows:
    uses: ./.github/workflows/build-job.yml
    with:
      name: Windows x64
      runner_generate: ubuntu-22.04
      runner_compile: windows-2022
      platform: Windows

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [Linux, Windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Validate public target and both provenance-hashed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC
          PYWRAP_SHA="$(git -C pywrap rev-parse HEAD)" python3 packaging/check_release.py dist
      - name: Publish tagged GitHub Release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite any assets.' >&2
            exit 1
          fi
          gh release create "$tag" dist/*.whl dist/*.provenance.json \
            --draft --verify-tag --title "$tag" \
            --notes 'CPython 3.13 Linux x86_64 and Windows x64 OCP wheels; requires separately installed conda-forge OCCT 8.0.1 novtk. SHA-256, source commits and OCCT package builds are recorded in each provenance asset.'
          gh release edit "$tag" --draft=false
