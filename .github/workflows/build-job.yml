name: Generate and compile native OCP novtk

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      runner_generate:
        required: true
        type: string
      runner_compile:
        required: true
        type: string
      platform:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  generate:
    name: Generate ${{ inputs.name }}
    runs-on: ${{ inputs.runner_generate }}
    timeout-minutes: 360
    env:
      STAGE: generate
      OCCT_BUILD: novtk_h6e372de_101
      CONDA_DEVENV_ENV_MANAGER: mamba
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: >-
            python=3.11
            mamba
            conda-devenv
      - name: Create exact conda-forge generation environment
        run: |
          micromamba create -n bindgen --yes
          micromamba run -n tools mamba-devenv -f environment.devenv.yml
      - name: Extract exact Windows OCCT libraries for cross-generation
        if: inputs.platform == 'Windows'
        run: |
          micromamba create --yes --platform win-64 --no-deps \
            --prefix "$RUNNER_TEMP/occt-win" -c conda-forge --override-channels \
            'occt=8.0.1=novtk_h6bfc850_101'
      - name: Generate Linux source against separate novtk OCCT
        if: inputs.platform == 'Linux'
        run: |
          micromamba run -n bindgen cmake -S . -B _generate -G Ninja \
            -DOCP_ENABLE_VTK=OFF -DPLATFORM=Linux -DN_PROC=2
          micromamba run -n bindgen cmake --build _generate --parallel 2
      - name: Cross-generate Windows source against separate novtk OCCT
        if: inputs.platform == 'Windows'
        run: |
          micromamba run -n bindgen cmake -S . -B _generate -G Ninja \
            -DOCP_ENABLE_VTK=OFF -DPLATFORM=Windows -DDLL_EXT=dll \
            -DOCCT_LIB_DIR="$RUNNER_TEMP/occt-win/Library/bin" -DN_PROC=2
          micromamba run -n bindgen cmake --build _generate --parallel 2
      - name: Upload generated C++ sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ inputs.platform }}
          path: _generate/OCP
          if-no-files-found: error
          compression-level: 0

  compile:
    name: Compile, package and smoke ${{ inputs.name }} CPython 3.13
    needs: generate
    runs-on: ${{ inputs.runner_compile }}
    timeout-minutes: 360
    env:
      STAGE: compile
      CONDA_DEVENV_ENV_MANAGER: mamba
      OCCT_BUILD: ${{ inputs.platform == 'Windows' && 'novtk_h6bfc850_101' || 'novtk_h6e372de_101' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: generated-${{ inputs.platform }}
          path: generated
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: >-
            python=3.11
            mamba
            conda-devenv
      - name: Create exact conda-forge compile environment
        run: |
          micromamba create -n bindgen --yes
          micromamba run -n tools mamba-devenv -f environment.devenv.yml
      - uses: ilammy/msvc-dev-cmd@v1
        if: inputs.platform == 'Windows'
        with:
          arch: amd64
      - name: Compile Linux extension linked to external OCCT
        if: inputs.platform == 'Linux'
        run: |
          micromamba run -n bindgen cmake -S generated -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DOCP_ENABLE_VTK=OFF \
            -DPYTHON_MODULE_EXTENSION=.so \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN/../..'
          micromamba run -n bindgen cmake --build build --parallel 2
      - name: Compile Windows extension linked to external OCCT
        if: inputs.platform == 'Windows'
        shell: pwsh
        env:
          CXX: cl.exe
        run: |
          micromamba run -n bindgen cmake -S generated -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DOCP_ENABLE_VTK=OFF `
            -DPYTHON_MODULE_EXTENSION=.pyd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          micromamba run -n bindgen cmake --build build --parallel 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate typing stubs from compiled native module (Linux)
        if: inputs.platform == 'Linux'
        run: |
          micromamba run -n bindgen bash -c \
            'LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" PYTHONPATH="$GITHUB_WORKSPACE/build" python -m pybind11_stubgen --root-suffix=-stubs -o "$GITHUB_WORKSPACE/build" OCP'
      - name: Generate typing stubs from compiled native module (Windows)
        if: inputs.platform == 'Windows'
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/build
        run: |
          micromamba run -n bindgen python -m pybind11_stubgen --root-suffix=-stubs -o build OCP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build tagged wheel with pinned conda OCCT provenance (Linux)
        if: inputs.platform == 'Linux'
        run: |
          micromamba run -n bindgen python packaging/build_wheel.py \
            --binary build/OCP.so --stubs build/OCP-stubs \
            --license LICENSE --output dist \
            --source-sha "$GITHUB_SHA" --pywrap-sha "$(git -C pywrap rev-parse HEAD)"
      - name: Build tagged wheel with pinned conda OCCT provenance (Windows)
        if: inputs.platform == 'Windows'
        shell: pwsh
        run: |
          $pywrapSha = git -C pywrap rev-parse HEAD
          micromamba run -n bindgen python packaging/build_wheel.py `
            --binary build/OCP.pyd --stubs build/OCP-stubs `
            --license LICENSE --output dist `
            --source-sha $env:GITHUB_SHA --pywrap-sha $pywrapSha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install wheel and build123d in clean conda-forge novtk environment
        run: |
          micromamba create -n smoke --yes -c conda-forge --override-channels \
            python=3.13 pip "occt=8.0.1=$OCCT_BUILD"
          micromamba run -n smoke python -m pip install --no-index --no-deps dist/*.whl
          printf 'cadquery-ocp-novtk==8.0.1.0.0+novtk.1\n' > ocp-constraint.txt
          micromamba run -n smoke python -m pip install -c ocp-constraint.txt 'build123d==0.13.0'
          micromamba run -n smoke python -m pip check
          micromamba run -n smoke python packaging/check_install.py
      - name: Upload verified wheel and OCCT/source provenance
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ inputs.platform }}
          path: |
            dist/*.whl
            dist/*.provenance.json
          if-no-files-found: error
          compression-level: 0
