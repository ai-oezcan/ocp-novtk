name: bindgen
channels:
  - conda-forge
dependencies:
  # CI supplies OCCT_BUILD for its exact platform; local builds may choose a novtk build.
  - occt=8.0.1={{ get_env("OCCT_BUILD", default="novtk_*") }}
  - python=3.13
  - pybind11=2.13.*
  - cmake>=3.29
  - ninja
  {% if get_env("STAGE", default="generate") == "generate" %}
  - clangdev
  - python-clang=21.*
  - libgl-devel # [linux]
  - rapidjson
  - joblib
  - toml
  - click
  - jinja2
  - logzero
  - pandas
  - path
  - pyparsing
  - schema
  - tqdm
  - toposort
  - py-lief
  - msitools # [linux]
  {% else %}
  - cxx-compiler
  - tbb-devel # [win]
  - fmt
  - pybind11-stubgen=2.5.5
  {% endif %}
